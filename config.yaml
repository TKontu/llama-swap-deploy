# llama-swap PAIRS config (GENERATED by gen_pairs_config.py — do not hand-edit).
# Each pairNN is a co-load group: two single-card models, one per 3090, serving
# concurrently. Callsign = pairNN.<model> (roles are assigned by the consuming
# system; split on the FIRST '.' to get the pair id). Only one pair (or one solo
# model) is resident at a time; requesting another swaps it in.
# Regenerate: python3 gen_pairs_config.py > config.pairs.yaml

healthCheckTimeout: 900
logLevel: info

# Pairs deliberately NOT generated (same family AND same role — near-duplicates):
#   qwen3.5-9b + qwen3.5-4b

models:

  # ===== pair01: gemma-26b (anchor, #0)  +  gemma-e4b (fast, #2) =====
  "pair01.gemma-26b":
    cmd: |
      docker run --rm --name ${MODEL_ID}
      -e HUGGING_FACE_HUB_TOKEN=${env.HF_TOKEN}
      -v /models/hf-cache:/root/.cache/huggingface
      -p ${PORT}:8000
      --gpus '"device=GPU-a8c640ca-4d44-440b-5caf-28eca88ea7c1"'
      vllm/vllm-openai:v0.26.0
      --model cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4
      --served-model-name ${MODEL_ID}
      --tensor-parallel-size 1 --gpu-memory-utilization 0.95
      --max-model-len 65536 --max-num-seqs 64
      --port 8000
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    ttl: 18000
    concurrencyLimit: 256
    filters:
      setParams:
        chat_template_kwargs:
          enable_thinking: false

