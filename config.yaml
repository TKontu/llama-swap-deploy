# llama-swap config (GENERATED by gen_config.py — do not hand-edit).
# Every single-card model is defined once per 3090: c0.<model> (3090 #0) and
# c2.<model> (3090 #2). The matrix router lets any c0 entry run alongside any c2
# entry, and a request evicts only the model on the card it needs. Models that
# need both cards are in no matrix set, so they run alone.
# Old callsigns (pairNN.<model>, x2extract.*, bare <model>) are aliases of the
# card entry they used to load on — transitional; see LEGACY_PAIRS.
# Regenerate: python3 gen_config.py > config.yaml
#
# HF AUTH: deliberately NOT passed as -e HF_TOKEN/-e HUGGING_FACE_HUB_TOKEN.
# llama-swap expands ${env.*} at spawn time and echoes the fully expanded
# command back from GET /running, which leaked the token in plaintext to
# anyone who could reach :9292. Instead the token is read from the HF cache
# that every model already mounts: write it to /models/hf-cache/token
# (chmod 600) on the host; huggingface_hub resolves $HF_HOME/token when no
# env var is set. Do not re-add the -e lines.

healthCheckTimeout: 900
logLevel: info
# List aliases in /v1/models so consumers that discover callsigns there keep
# seeing the old pairNN ids during the transition.
includeAliasesInList: true

models:

  # ===== c0: single-card models on GPU-a8c640ca-4d44-440b-5caf-28eca88ea7c1 =====
  "c0.gemma-26b":
    cmd: |
      docker run --rm --name ${MODEL_ID}
      -v /models/hf-cache:/root/.cache/huggingface
      -p ${PORT}:8000
      --gpus '"device=GPU-a8c640ca-4d44-440b-5caf-28eca88ea7c1"'
      vllm/vllm-openai:v0.26.0
      --model cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4
      --served-model-name ${MODEL_ID}
      --tensor-parallel-size 1 --gpu-memory-utilization 0.95
      --max-model-len 65536 --max-num-seqs 64
      --port 8000
    cmdStop: docker stop ${MODEL_ID}
    proxy: http://127.0.0.1:${PORT}
    ttl: 18000
    concurrencyLimit: 256
    useModelName: "c0.gemma-26b"
    aliases:
      - "gemma-26b"
      - "pair01.gemma-26b"
      - "pair02.gemma-26b"
      - "pair04.gemma-26b"
      - "pair06.gemma-26b"
      - "pair10.gemma-26b"
      - "pair15.gemma-26b"
      - "pair21.gemma-26b"
      - "pair28.gemma-26b"
