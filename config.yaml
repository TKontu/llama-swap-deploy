routing:
  router:
    use: matrix
    settings:
      matrix:
        sets:
          cards: >-
            (c0.gemma-26b
              | c0.gemma-e4b
              | c0.qwen3.5-4b
              | c0.qwythos-v2
              | c0.qwen3.8-27b
              | c0.muse-glimmer
            )
            & (c2.gemma-26b
              | c2.gemma-e4b
              | c2.qwen3.5-4b
              | c2.qwythos-v2
              | c2.qwen3.8-27b
              | c2.muse-glimmer
              | c2.comfyui
            )
            & a4.comfyui
          wholebox: >-
            (Qwen3.6-35B-A3B-AWQ-4bit
              | Qwen3.6-35B-A3B-32k-128seqs
              | Muse-Glimmer-30B-split
              | Qwen3.8-27B-split
              | deepseek-v4-flash
            )
            & a4.comfyui
