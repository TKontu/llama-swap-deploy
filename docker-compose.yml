# llama-swap stack for the `inference` host (deploy via Portainer, GitOps).
#
# - image: → Portainer CANNOT build from a Git repository stack, so we run a
#   PRE-BUILT image from GHCR. It is built & pushed by .github/workflows/build-and-push.yml
#   on every push that touches the Dockerfile. Set LLAMA_SWAP_IMAGE as a stack env var
#   (e.g. ghcr.io/<owner>/llama-swap-deploy:latest). See README → "Deploy with Portainer".
# - network_mode: host → llama-swap listens on 127.0.0.1:9293 and reaches the model
#   containers at 127.0.0.1:<PORT> (published on loopback only).
# - edge (Caddy) is what the LAN talks to, on :9292: it forwards to llama-swap, keeps
#   raw ComfyUI off the LAN, and refuses new work while a deploy drains.
# - deploy-gate redeploys the stack (Portainer webhook) when a new image is on GHCR, but
#   only once nothing is in flight. See README → "Deploy gate".
# - /var/run/docker.sock → lets llama-swap spawn vLLM containers (DooD).
# - runtime: nvidia → GPUs for any bundled llama.cpp child processes.

services:
  llama-swap:
    # Pre-built image (see workflow above). Defaults to this repo's GHCR package;
    # override with the LLAMA_SWAP_IMAGE stack env var to pin a :sha tag or a fork.
    image: ${LLAMA_SWAP_IMAGE:-ghcr.io/tkontu/llama-swap-deploy:latest}
    # For LOCAL development only (Portainer ignores this for Git stacks):
    #   docker compose build && docker compose up
    # build: .
    container_name: llama-swap
    restart: unless-stopped
    # llama-swap drains in-flight requests for up to 30 s (hard-coded) on SIGTERM, then stops
    # its model containers. Docker's default 10 s would SIGKILL it first, so it could neither
    # drain nor stop them. A stop still cuts anything longer than 30 s: deploys go through
    # deploy-gate, which redeploys only when nothing is in flight.
    stop_grace_period: 60s
    network_mode: host
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # HF_TOKEN is intentionally NOT injected. It was only ever here so that
      # `${env.HF_TOKEN}` could be interpolated into each model's `docker run`
      # line -- which llama-swap then echoed back, in plaintext, from GET /running.
      # Model containers now read the token from /models/hf-cache/token inside the
      # HF cache volume they already mount. See README -> "HuggingFace auth".
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /models/hf-cache:/root/.cache/huggingface
      # config.yaml is baked into the image (see Dockerfile). To live-edit it on the host
      # instead of rebuilding, uncomment the next line AND point it at a real file on the
      # host (NOT a Portainer relative path, which auto-creates a directory and fails):
      #   - /models/llama-swap/config.yaml:/etc/llama-swap/config/config.yaml:ro
    command:
      - --config
      - /etc/llama-swap/config/config.yaml
      # Loopback only: the LAN comes in through `edge` on :9292.
      - --listen
      - 127.0.0.1:9293
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9293/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Keeps ONCALL_MODEL resident whenever the box has stopped working, without ever
  # blocking another model — the matrix router evicts it for any other card-0 or
  # whole-box model, and the wakeup request itself evicts whatever is on card 0. See
  # scripts/oncall-wakeup.sh and README → "On-call standby model".
  #
  # Reuses the llama-swap image (the script is baked in, and curl/awk are present) so
  # there's no second image to build and no bind mount for Portainer to mangle. It needs
  # neither GPUs nor the docker socket — only HTTP access to llama-swap, hence host
  # networking and no `runtime: nvidia`.
  oncall-wakeup:
    image: ${LLAMA_SWAP_IMAGE:-ghcr.io/tkontu/llama-swap-deploy:latest}
    container_name: oncall-wakeup
    restart: unless-stopped
    network_mode: host
    depends_on:
      - llama-swap
    entrypoint: ["/usr/local/bin/oncall-wakeup.sh"]
    environment:
      # Through the edge, so a deploy drain refuses its wakeup too (a failed wake is retried
      # after the next idle hour).
      - LLAMASWAP_URL=http://127.0.0.1:9292
      # Real model ID, not an alias — the poller matches it against /running.
      - ONCALL_MODEL=c0.muse-glimmer
      # Never evict these, whatever the GPUs read: a RAM-offload MoE looks idle on the cards
      # while it decodes. Must match the bigmoe=True entries — gen_config.py enforces it.
      - BIGMOE_MODELS=deepseek-v4-flash
      # Both 3090s must sit below IDLE_PCT for this long before the model is woken.
      # This becomes the effective replacement delay for an idle model, so it is
      # deliberately long — the 5 h / 10 h TTLs still govern unloading.
      - IDLE_SECONDS=3600
      - IDLE_PCT=5
      - POLL_SECONDS=60

  # The LAN entry point, on :9292 (docker/edge/Caddyfile, image built by edge-image.yml).
  #   - Forwards everything to llama-swap on 127.0.0.1:9293, streams and websockets included.
  #   - Only loopback clients (media-gateway, an SSH tunnel) may reach ComfyUI
  #     (/upstream/*comfyui*, /comfyui): its API runs arbitrary workflows and node code.
  #   - While /state/drain exists (set by deploy-gate), new work gets 503 + Retry-After; reads,
  #     /api/* and ComfyUI acks still pass, and requests already in flight finish.
  edge:
    image: ${EDGE_IMAGE:-ghcr.io/tkontu/llama-swap-edge:latest}
    container_name: llama-swap-edge
    restart: unless-stopped
    network_mode: host
    depends_on:
      - llama-swap
    volumes:
      - edge-state:/state
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9292/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Push-to-deploy that never cuts work. Polls GHCR for a new digest of the llama-swap image.
  # When one appears it sets the edge's drain flag, waits until nothing is in flight (LLM
  # requests and ComfyUI holds), then calls the Portainer webhook. If work is still running
  # after DRAIN_MAX_S it gives up and retries later — it never forces a deploy. See
  # scripts/deploy-gate.py and README → "Deploy gate".
  #
  # Same image as llama-swap (the script is baked in). The docker socket is only used for
  # `docker inspect` of the llama-swap container's image digest.
  deploy-gate:
    image: ${LLAMA_SWAP_IMAGE:-ghcr.io/tkontu/llama-swap-deploy:latest}
    container_name: deploy-gate
    restart: unless-stopped
    network_mode: host
    depends_on:
      - llama-swap
      - edge
    entrypoint: ["python3", "/usr/local/bin/deploy-gate.py"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - edge-state:/state
    environment:
      # Set in Portainer (stack → environment), never in the repo: GitOps webhook URL.
      - PORTAINER_WEBHOOK_URL=${PORTAINER_WEBHOOK_URL:-}
      - IMAGE=${LLAMA_SWAP_IMAGE:-ghcr.io/tkontu/llama-swap-deploy:latest}
      - LLAMASWAP_URL=http://127.0.0.1:9293
      - POLL_S=120
      - STABLE_S=15
      - DRAIN_MAX_S=21600
      - RETRY_AFTER_ABORT_S=3600

volumes:
  edge-state:
