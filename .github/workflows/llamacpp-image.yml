name: llamacpp-image

# Builds the pinned mainline llama.cpp images from ONE Dockerfile and pushes them to GHCR.
# Each image is a different LLAMACPP_TAG pin, so a model can move to a newer llama.cpp without
# re-testing every model on the older pin:
#   llamacpp-mainline  b10362  Muse-Glimmer-30B, Qwen3.8-27B
#   llamacpp-v4        v0.4.0  DeepSeek-V4-Flash (CUDA sparse FA for DSV4, #27970)
# If a third pin is ever needed, add a matrix row here — not another Dockerfile.
# This is a CUDA compile, so it only runs when its own files change or on manual dispatch —
# NOT on every push.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.llamacpp"
      - "docker/gguf-serve.sh"
      - ".github/workflows/llamacpp-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: llamacpp-mainline   # separate package from bonsai
            llamacpp_tag: b10362
          - image: llamacpp-v4
            llamacpp_tag: v0.4.0
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.image }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      # The CUDA build produces GBs of object files; the runner's / is only ~14 GB.
      # Free extra space AND move Docker's storage to the large /mnt volume (~70 GB)
      # so buildkit doesn't fill / mid-build.
      - name: Maximize build disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android /opt/hostedtoolcache /usr/share/swift \
                      /usr/local/share/boost /usr/lib/jvm /usr/share/miniconda || true
          sudo swapoff -a || true
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          echo "--- disk ---"; df -h / /mnt; docker info | grep -i "docker root" || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        # docker-container driver is required for the GHA layer cache (cache-to/from).
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.llamacpp
          build-args: |
            LLAMACPP_TAG=${{ matrix.llamacpp_tag }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-image cache scope: the two pins would otherwise overwrite each other's layers.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          echo "### ${{ matrix.image }} (llama.cpp ${{ matrix.llamacpp_tag }}) pushed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" | tr ' ' '\n' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Public automatically (repo is public + OCI source label); referenced by config.yaml." >> "$GITHUB_STEP_SUMMARY"
